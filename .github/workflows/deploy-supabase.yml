name: Deploy Elevspor database

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/templates/**"
      - "supabase/config.toml"
  workflow_dispatch:
    inputs:
      owner_email:
        description: "Optional owner email for a new Test-Skole bootstrap"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: elevspor-supabase-production
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    name: Migrate and verify hosted database
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      ELEVSPOR_BOOTSTRAP_TOKEN: ${{ secrets.ELEVSPOR_BOOTSTRAP_TOKEN }}

    steps:
      - name: Check required configuration
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Missing SUPABASE_DB_PASSWORD repository secret"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::Missing SUPABASE_PROJECT_REF repository variable"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL repository variable"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing SUPABASE_PUBLISHABLE_KEY repository variable"; exit 1; }

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Elevspor production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending migrations
        run: supabase db push --linked --dry-run

      - name: Apply pending migrations
        run: supabase db push --linked

      - name: Enable invite-only authentication hook
        shell: bash
        run: |
          jq -n \
            '{
              site_url: "https://nickzen108.github.io/iTalk/",
              mailer_autoconfirm: false,
              mailer_otp_length: 8,
              mfa_totp_enroll_enabled: true,
              mfa_totp_verify_enabled: true,
              hook_before_user_created_enabled: true,
              hook_before_user_created_uri: "pg-functions://postgres/public/hook_allow_invited_staff"
            }' > /tmp/elevspor-auth-patch.json
          auth_status="$(curl --silent --show-error \
            --request PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/elevspor-auth-patch.json \
            --output /tmp/elevspor-auth-config.json \
            --write-out '%{http_code}')"
          if [[ "$auth_status" != 2* ]]; then
            echo "::error::Supabase auth configuration returned HTTP $auth_status"
            jq -r '{message, error, details}' /tmp/elevspor-auth-config.json
            exit 1
          fi
          jq -e '
            .site_url == "https://nickzen108.github.io/iTalk/"
            and .mailer_autoconfirm == false
            and .mailer_otp_length == 8
            and .mfa_totp_enroll_enabled == true
            and .mfa_totp_verify_enabled == true
            and .hook_before_user_created_enabled == true
            and .hook_before_user_created_uri == "pg-functions://postgres/public/hook_allow_invited_staff"
          ' /tmp/elevspor-auth-config.json >/dev/null
          echo "Invite-only auth hook and existing email/MFA safeguards are active."

      - name: Apply branded authentication emails when SMTP permits it
        shell: bash
        run: |
          confirmation_template="$(jq -Rs . < supabase/templates/confirmation.html)"
          invite_template="$(jq -Rs . < supabase/templates/invite.html)"
          jq -n \
            --argjson confirmation_template "$confirmation_template" \
            --argjson invite_template "$invite_template" \
            '{
              mailer_subjects_confirmation: "Bekræft din ElevSpor-konto",
              mailer_templates_confirmation_content: $confirmation_template,
              mailer_subjects_invite: "Du er inviteret til ElevSpor",
              mailer_templates_invite_content: $invite_template
            }' > /tmp/elevspor-mail-patch.json
          mail_status="$(curl --silent --show-error \
            --request PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/elevspor-mail-patch.json \
            --output /tmp/elevspor-mail-config.json \
            --write-out '%{http_code}')"
          if [[ "$mail_status" == 2* ]]; then
            jq -e '
              .mailer_subjects_confirmation == "Bekræft din ElevSpor-konto"
              and .mailer_subjects_invite == "Du er inviteret til ElevSpor"
              and (.mailer_templates_confirmation_content | contains("{{ .ConfirmationURL }}"))
              and (.mailer_templates_invite_content | contains("{{ .ConfirmationURL }}"))
            ' /tmp/elevspor-mail-config.json >/dev/null
            echo "Branded ElevSpor authentication emails are active."
          elif jq -e '.message | contains("not available for free tier projects using the default email provider")' \
            /tmp/elevspor-mail-config.json >/dev/null; then
            echo "::warning::ElevSpor mail templates are ready but require custom SMTP or a paid Supabase plan."
          else
            echo "::error::Supabase mail template configuration returned HTTP $mail_status"
            jq -r '{message, error, details}' /tmp/elevspor-mail-config.json
            exit 1
          fi

      - name: Create Test-Skole owner bootstrap
        if: ${{ inputs.owner_email != '' }}
        env:
          OWNER_EMAIL: ${{ inputs.owner_email }}
        shell: bash
        run: |
          [[ "$OWNER_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] || {
            echo "::error::Invalid owner email"
            exit 1
          }
          [[ "$ELEVSPOR_BOOTSTRAP_TOKEN" =~ ^[a-f0-9]{48}$ ]] || {
            echo "::error::Missing or invalid ELEVSPOR_BOOTSTRAP_TOKEN secret"
            exit 1
          }
          echo "::add-mask::$ELEVSPOR_BOOTSTRAP_TOKEN"
          supabase db query --linked \
            "select public.create_school_bootstrap('Test-Skole', '$OWNER_EMAIL', 'Nicolai', '$ELEVSPOR_BOOTSTRAP_TOKEN');"

      - name: Show migration status
        run: supabase migration list --linked

      - name: Test hosted database and school isolation
        run: supabase test db --linked

      - name: Verify schools endpoint exists and rejects anonymous access
        shell: bash
        run: |
          status="$(
            curl --silent --show-error --output /tmp/elevspor-schools-response.json \
              --write-out "%{http_code}" \
              "$SUPABASE_URL/rest/v1/schools?select=id&limit=1" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY"
          )"
          test "$status" = "401" || {
            echo "::error::Expected anonymous schools request to be denied with HTTP 401, got $status"
            jq -r '{code, message, hint}' /tmp/elevspor-schools-response.json
            exit 1
          }
          jq -e '
            .code == "42501"
            and .message == "permission denied for table schools"
          ' /tmp/elevspor-schools-response.json >/dev/null
          echo "Elevspor public.schools exists in PostgREST and correctly rejects anonymous access."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend with public configuration only
        run: |
          npm ci
          npm test
          npm run build

      - name: Reject privileged credentials in frontend output
        shell: bash
        run: |
          if grep -RqlF "$SUPABASE_ACCESS_TOKEN" dist ||
             grep -RqlF "$SUPABASE_DB_PASSWORD" dist; then
            echo "::error::Privileged Supabase credential found in frontend output"
            exit 1
          fi
          if grep -Eiq \
            'SUPABASE_ACCESS_TOKEN|SUPABASE_DB_PASSWORD|service_role|sb_secret_' \
            dist/runtime-config.js; then
            echo "::error::Privileged Supabase configuration marker found in runtime config"
            exit 1
          fi
          grep -qF "$SUPABASE_URL" dist/runtime-config.js
          grep -qF "$SUPABASE_PUBLISHABLE_KEY" dist/runtime-config.js
          echo "Frontend contains only the public Supabase configuration."
